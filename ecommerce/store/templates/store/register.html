<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F5F0; font-family: 'Segoe UI', Arial, sans-serif; }
        .card { background: #fff; padding: 40px 36px; border-radius: 16px; box-shadow: 0 4px 24px rgba(20,23,28,0.08); width: 100%; max-width: 360px; }
        h1 { font-size: 1.6rem; margin: 0 0 24px; color: #14171C; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #14171C; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; margin-bottom: 18px; border: 1px solid rgba(20,23,28,0.2); border-radius: 10px; font-size: 0.95rem; outline: none; }
        button { width: 100%; padding: 13px 0; background: #14171C; color: #F6F5F0; border: none; border-radius: 999px; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #2440E0; }
        p { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #555; }
        a { color: #2440E0; text-decoration: none; }
        .error { background: #fdecea; color: #a33; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Register</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/register/">
            {% csrf_token %}
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login/">Login</a></p>
    </div>
</body>
</html>
